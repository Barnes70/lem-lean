name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Negative tests (terms Lean must reject)
        run: lake env lean test/Rejections.lean
